load_offline_data: False
pre_train: False
dataset_path: null
work_dir: null
task: AssettoCorsaGym
seed: 0

# Wandb & Checkpointing
disable_wandb: True
wandb_entity: null
wandb_project: sac
wandb_silent: True
exp_name: null
task_title: null
save_csv: True
save_video: False
save_agent: True
action_dim: 3
steps: null

Agent:
  num_steps: 2_000_000
  batch_size: 128
  memory_size: 300_000         # ~1.2 GB RAM (prevents ArrayMemoryError)
  offline_buffer_size: 300_000
  use_offline_buffer: False
  update_interval: 1
  start_steps: 2000            # 80s of exploration before training starts
  log_interval: 10
  eval_interval: 0             # Keep 0 to avoid multi-threaded socket contention
  num_eval_episodes: 1
  checkpoint_freq: 25_000

SAC:
  gamma: 0.992
  nstep: 3
  policy_lr: 0.0003
  q_lr: 0.0003
  entropy_lr: 0.0003
  policy_hidden_units: [256, 256, 256]
  q_hidden_units: [256, 256, 256]
  target_update_coef: 0.005
  max_grad_norm: 10.0
  log_interval: 10

AssettoCorsa:
  ego_server_host_name: "localhost"
  opponents_server_host_name: "localhost"
  simulation_management_server_host_name: "localhost"
  
  ego_sampling_freq: 25     # 25 Hz physics rate
  max_episode_py_time: 180. # 3 minutes per episode
  gap_const: 12.
  eval_number_of_laps: 1
  save_lap_csv: False
  remote_machine_ip: "localhost"
  ego_server_port: 2345
  opponents_server_port: 2346
  simulation_management_server_port: 2347
  
  use_relative_actions: False
  enable_sensors: False
  vjoy_executed_by_server: False
  enable_out_of_track_termination: True
  enable_low_speed_termination: False
  recover_car_on_done: False
  send_reset_at_start: True
  record_controls_from_client: False
  enable_out_of_track_penalty: False
  max_laps_number: null
  enable_task_id_in_obs: False
  penalize_actions_diff: False
  penalize_actions_diff_coef: 0.1
  max_steer_rate: 900.0
  
  track: "ks_barcelona-layout_gp"
  car: "dallara_f317"
  
  use_ac_out_of_track: True
  add_previous_obs_to_state: False
  use_reference_line_in_reward: True
  use_target_speed: False
  
  screen_capture_enable: False
  final_image_width: 640
  final_image_height: 480
  color_mode: "bgr"
  use_obs_extra: False